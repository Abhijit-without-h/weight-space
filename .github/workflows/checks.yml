name: Research checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    name: Recorded evidence and publication boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_evidence.py

  scientific-tests:
    name: Scientific contracts (no training)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_games test_export test_paired_data test_sokoban_demo test_spatial_edit
